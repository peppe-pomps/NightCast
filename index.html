<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Esplora il cielo stellato di stasera, controlla il meteo astronomico e scopri i pianeti visibili nella tua posizione.">
        
        <meta property="og:title" content="NightCast">
        <meta property="og:description" content="Scopri cosa si vede nel cielo stanotte.">

        <title>NightCast</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
        <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>

        <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
        <script src="js/app.js" defer></script>
        <script src="js/dashboard.js" defer></script>
    </head>

    <body>
        <div id="particles-js"></div>

        <div id="page-wrapper">
            <section id="main">
                <main>
                    <div class="main-content">
                        <h1>
                            <img src="assets/logo.svg" alt="NightCast" class="main-logo">
                        </h1>

                        <h2>Le previsoni della notte</h2>

                        <div class="main-description">
                            <p>Scopri se stanotte vale la pena alzare gli occhi al cielo. Meteo stellare, fase lunare, pianeti visibili e prossimi eventi astronomici — basati sulla tua posizione reale.</p>
                        </div>

                        <a href="#" class="main-button glass-card">
                            Esplora Ora <i class="fa-solid fa-arrow-up"></i>
                        </a>
                    </div>
                </main>

                <footer class="glass-card">
                    <div class="footer-left">
                        <p>© 2026 | Giuseppe Pompilio</p>
                    </div>
        
                    <div class="footer-center">
                        <a href="https://github.com/peppe-pomps" target="_blank" class="footer-link" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                        <a href="https://www.instagram.com/peppe.pomps89?igsh=MXdieWY1aWg5YnJpZw==" target="_blank" class="footer-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://www.tiktok.com/@peppe_pomps89?_r=1&_t=ZN-96fAaWPmuwQ" target="_blank" class="footer-link" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                    </div>
        
                    <div class="footer-right">
                        <span id="version">v1.3.3</span>
                    </div>
                </footer>
            </section>

            <section id="dashboard">
                <div class="dashboard-nav">
                    <h1>
                        <img src="assets/logo.svg" alt="NightCast" class="nav-logo">
                    </h1>
                </div>

                <div class="dashboard-content">
                    <div class="location-card glass-card" id="location-card">
                        <div class="location-header">
                            <i class="fa-solid fa-location-dot"></i>
                            <span id="location-name">Nessuna posizione selezionata</span>
                        </div>

                        <div class="location-actions">
                            <button id="button-gps" class="glass-card">
                                <i class="fa-solid fa-crosshairs"></i> Usa la mia posizione
                            </button>

                            <div class="location-search">
                                <input type="text" id="location-input" placeholder="Cerca una città">
                                <button id="button-search">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                            </div>
                        </div>

                        <div id="mini-map"></div>

                        <div id="day-selector" class="day-selector glass-card"></div>
                    </div>
                </div>

                <button id="back-button" class="back-button glass-card">
                    Torna giù<i class="fa-solid fa-arrow-down"></i>
                </button>
            </section>
        </div>
    </body>
</html>
